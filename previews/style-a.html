<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Revenue Operating System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   THEME — "Signal Orbit": black stage, one luminous system
   =========================================== */
:root{
  --stage-bg:#030407; --slide-bg:#030407;
  --ink:#f5f6fa; --mute:#8b90a3; --faint:#2a2e3d;
  --c1:#6ef2d0; --c2:#7fb2ff; --c3:#ffcf7a;
  --font-display:'Instrument Sans',sans-serif; --font-accent:'Instrument Serif',serif; --font-mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}

/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}


/* ===========================================
   TITLE SLIDE
   =========================================== */
.slide{font-family:var(--font-display);color:var(--ink)}
.atmos{position:absolute;inset:0;background:
  radial-gradient(760px 620px at 1395px 540px,rgba(127,178,255,.16),transparent 70%),
  radial-gradient(420px 380px at 1395px 540px,rgba(110,242,208,.10),transparent 70%)}
.grain{position:absolute;inset:0;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:32px 32px;
  -webkit-mask-image:radial-gradient(900px 700px at 1395px 540px,#000,transparent 75%);mask-image:radial-gradient(900px 700px at 1395px 540px,#000,transparent 75%)}
.copy{position:absolute;left:150px;top:300px;width:820px}
.eyebrow{font:500 22px var(--font-mono);letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
h1{font-weight:600;font-size:136px;line-height:.98;letter-spacing:-.045em;margin-top:34px}
h1 em{font-family:var(--font-accent);font-style:italic;font-weight:400;letter-spacing:-.02em;
  background:linear-gradient(100deg,var(--c1) 0%,var(--c2) 55%,var(--c3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.sub{font-size:32px;line-height:1.4;color:var(--mute);margin-top:40px;width:680px}
.meta{position:absolute;left:150px;bottom:84px;font:400 18px var(--font-mono);letter-spacing:.12em;color:#555b70;text-transform:uppercase}

/* === ORBIT DIAGRAM === */
.orbit{position:absolute;left:945px;top:90px;width:900px;height:900px}
.orbit text{font-family:var(--font-display);fill:var(--ink)}
.orbit .lbl{font-size:25px;font-weight:600}
.orbit .num{font:500 15px var(--font-mono);fill:var(--mute);letter-spacing:.14em}
.ring-guide{fill:none;stroke:var(--faint);stroke-width:1}
.ring{fill:none;stroke:url(#spectrum);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1}
.spoke{fill:none;stroke:rgba(245,246,250,.28);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1}
.pulse{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-dasharray:.035 .965;stroke-dashoffset:.035;opacity:0;filter:url(#glow)}
.spark{fill:none;stroke:var(--c1);stroke-width:3;stroke-linecap:round;stroke-dasharray:.12 .88;stroke-dashoffset:.12;opacity:0}
.node{opacity:0;transform-box:fill-box;transform-origin:center}
.core{opacity:0;transform-box:fill-box;transform-origin:center}

/* === MOTION — the system assembles, then starts to flow === */
.slide.visible .reveal{animation:rise 1s var(--ease) both}
.slide.visible .eyebrow{animation-delay:.1s}.slide.visible h1{animation-delay:.25s}.slide.visible .sub{animation-delay:.5s}.slide.visible .meta{animation-delay:.7s}
.slide.visible .ring{animation:draw 1.8s var(--ease) .4s forwards}
.slide.visible .node{animation:pop .7s var(--ease) forwards}
.slide.visible .n1{animation-delay:.7s}.slide.visible .n2{animation-delay:1.0s}.slide.visible .n3{animation-delay:1.3s}.slide.visible .n4{animation-delay:1.6s}
.slide.visible .spoke{animation:draw .9s var(--ease) forwards}
.slide.visible .s1{animation-delay:1.9s}.slide.visible .s2{animation-delay:2.0s}.slide.visible .s3{animation-delay:2.1s}.slide.visible .s4{animation-delay:2.2s}
.slide.visible .core{animation:bloom 1.1s var(--ease) 2.5s forwards}
.slide.visible .pulse{animation:travel 4.8s linear 3.1s infinite,fadein .6s 3.1s forwards}
.slide.visible .spark{animation:inward 1.6s var(--ease) 3.3s infinite,fadein .4s 3.3s forwards}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
@keyframes bloom{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes travel{to{stroke-dashoffset:-.965}}
@keyframes inward{0%{stroke-dashoffset:.12}100%{stroke-dashoffset:-.88}}
@keyframes fadein{to{opacity:1}}
</style>
</head>
<body>
<div class="deck-viewport">
<main class="deck-stage" id="deckStage">
<section class="slide active visible" aria-label="Title">
  <div class="atmos"></div><div class="grain"></div>
  <div class="copy">
    <div class="eyebrow reveal">Revenue Operations · 2026</div>
    <h1 class="reveal">Revenue, as <em>one system.</em></h1>
    <p class="sub reveal">How strategy, CRM data, pipeline and forecasting feed a single decision engine.</p>
  </div>
  <div class="meta reveal">RevOps Strategy Office</div>

  <svg class="orbit" viewBox="0 0 900 900" role="img" aria-label="Four revenue functions on an orbit, all connected to a central AI decision core">
    <defs>
      <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ef2d0"/><stop offset=".55" stop-color="#7fb2ff"/><stop offset="1" stop-color="#ffcf7a"/></linearGradient>
      <radialGradient id="coreFill"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#cfe0ff"/><stop offset=".7" stop-color="#7fb2ff" stop-opacity=".55"/><stop offset="1" stop-color="#7fb2ff" stop-opacity="0"/></radialGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <circle class="ring-guide" cx="450" cy="450" r="330"/>
    <circle class="ring-guide" cx="450" cy="450" r="200" stroke-dasharray="2 8"/>
    <!-- orbit: starts at top (strategy), runs clockwise -->
    <path class="ring" pathLength="1" d="M450 120 A330 330 0 1 1 449.9 120"/>
    <!-- spokes: each function feeds the core -->
    <path class="spoke s1" pathLength="1" d="M450 132 L450 362"/>
    <path class="spoke s2" pathLength="1" d="M768 450 L538 450"/>
    <path class="spoke s3" pathLength="1" d="M450 768 L450 538"/>
    <path class="spoke s4" pathLength="1" d="M132 450 L362 450"/>
    <!-- flow: a light pulse circulates; sparks travel inward along spokes -->
    <path class="pulse" pathLength="1" d="M450 120 A330 330 0 1 1 449.9 120"/>
    <path class="spark" pathLength="1" d="M450 132 L450 362"/>
    <path class="spark" pathLength="1" d="M768 450 L538 450" style="animation-delay:3.7s,3.7s"/>
    <path class="spark" pathLength="1" d="M450 768 L450 538" style="animation-delay:4.1s,4.1s"/>
    <path class="spark" pathLength="1" d="M132 450 L362 450" style="animation-delay:4.5s,4.5s"/>
    <!-- core -->
    <g class="core"><circle cx="450" cy="450" r="150" fill="url(#coreFill)" opacity=".55"/><circle cx="450" cy="450" r="84" fill="#0b0f1c" stroke="#cfe0ff" stroke-width="1.5"/>
      <text x="450" y="443" text-anchor="middle" class="lbl" style="font-size:24px">AI</text><text x="450" y="472" text-anchor="middle" class="lbl" style="font-size:21px;font-weight:500;fill:#b9c3dc">decisions</text></g>
    <!-- nodes -->
    <g class="node n1"><circle cx="450" cy="120" r="11" fill="#030407" stroke="#6ef2d0" stroke-width="3"/><text x="450" y="64" text-anchor="middle" class="num">01</text><text x="450" y="94" text-anchor="middle" class="lbl">Go-to-market strategy</text></g>
    <g class="node n2"><circle cx="780" cy="450" r="11" fill="#030407" stroke="#7fb2ff" stroke-width="3"/><text x="780" y="384" text-anchor="middle" class="num">02</text><text x="780" y="414" text-anchor="middle" class="lbl">CRM data</text></g>
    <g class="node n3"><circle cx="450" cy="780" r="11" fill="#030407" stroke="#a7b9ff" stroke-width="3"/><text x="450" y="826" text-anchor="middle" class="num">03</text><text x="450" y="856" text-anchor="middle" class="lbl">Pipeline</text></g>
    <g class="node n4"><circle cx="120" cy="450" r="11" fill="#030407" stroke="#ffcf7a" stroke-width="3"/><text x="120" y="384" text-anchor="middle" class="num">04</text><text x="120" y="414" text-anchor="middle" class="lbl">Forecast</text></g>
  </svg>
</section>
</main>
</div>
<script>
/* Stage scaling: 1920×1080 canvas scaled uniformly to the window */
(function(){const s=document.getElementById('deckStage');const f=()=>{const k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`translate(${(innerWidth-1920*k)/2}px,${(innerHeight-1080*k)/2}px) scale(${k})`};f();addEventListener('resize',f)})();
</script>
</body>
</html>
